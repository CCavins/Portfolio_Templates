<!DOCTYPE html>
<html lang="en" data-theme="darkroom">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jules Marin · Photographer</title>
  <meta name="description" content="Portfolio of Jules Marin, a photographer based in Lisbon." />
  <meta property="og:title" content="Jules Marin · Photographer" />
  <meta property="og:description" content="Portfolio of Jules Marin, a photographer based in Lisbon." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#101010" />
  <!--
    ============================================================
    PLATE — single-file photography template
    A contact sheet. Each frame is a stand-in for a photograph;
    clicking one opens it larger with its caption.
    ============================================================

    HOW TO EDIT

    1. TEXT. Replace every element with data-field="…": name, role,
       captions, about line, links. Update <title> and the
       description / og: meta tags. Sample copy is fictional.

    2. PHOTOS. Each <button class="frame"> shows a colored gradient
       until you give it a photo. Put your images in a folder named
       photos next to index.html, then on the frame add:
         style="background-image: url('photos/coast.jpg')"
       The gradient class (f1, f2 …) can stay; the image covers it.
       For a sharper large version in the lightbox, also add
         data-full="photos/coast-large.jpg"
       Copy a frame to add a photo; delete one to remove it.

    3. LIGHTBOX. Clicking a frame opens the <dialog> at the bottom
       of the file. It needs no library. Escape or the Close button
       dismisses it.

    4. THEME. Change data-theme="darkroom" on the <html> tag to:
         darkroom  near-black wall (default)
         gallery   white wall, thin grey captions
       Colors live in the THEMES block at the top of <style>.
       Preview without editing: index.html?theme=gallery

    5. FONTS. Bodoni Moda and Manrope load from Google Fonts.

    6. PUBLISH. Upload this folder (including photos/) to any static
       host; the entry file is index.html. If you copied this file
       from the gallery, delete the <a class="template-gallery"> link.
  -->
  <script>
    // Gallery support: ?preview=1 hides the "All templates" bar; ?theme=name previews a theme.
    (function () {
      var q = location.search;
      if (q.indexOf("preview=1") !== -1) document.documentElement.classList.add("previewing");
      var m = q.match(/[?&]theme=([\w-]+)/);
      if (m) document.documentElement.setAttribute("data-theme", m[1]);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ---------- THEMES ---------- */

    /* THEME: darkroom (default) — near-black wall, warm white text */
    :root, [data-theme="darkroom"] {
      --wall: #101010;
      --ink: #f3f1ec;
      --muted: #b9b3a8;
      --caption-ink: #111;
      --dialog-bg: rgba(10, 10, 10, .96);
      --gallery-bar: 34px;
    }
    /* THEME: gallery — white wall, grey captions */
    [data-theme="gallery"] {
      --wall: #f6f5f2;
      --ink: #161616;
      --muted: #6d6a64;
      --caption-ink: #fff;
      --dialog-bg: rgba(246, 245, 242, .97);
    }

    /* ---------- LAYOUT ---------- */
    * { box-sizing: border-box; }
    html.previewing { --gallery-bar: 0px; }
    html.previewing, html.previewing body { overflow: hidden; height: 100%; }
    html.previewing .template-gallery { display: none; }
    body { margin: 0; padding-top: var(--gallery-bar); background: var(--wall); color: var(--ink); font-family: Manrope, "Avenir Next", sans-serif; line-height: 1.4; }
    a { color: inherit; }
    a:focus-visible, .frame:focus-visible, .close:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    header { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; padding: 1.3rem 1.2rem 1rem; }
    h1 { margin: 0; font-family: "Bodoni Moda", Georgia, serif; font-weight: 500; font-size: clamp(2.2rem, 4vw, 3.2rem); letter-spacing: -0.03em; line-height: 1; }
    .meta { margin: .3rem 0 0; color: var(--muted); font-size: .92rem; }
    nav { display: flex; gap: 1rem; font-size: .92rem; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--ink); }
    .sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; padding: 0 .7rem 3rem; }
    .frame {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      padding: 0;
      border: 0;
      background-size: cover;
      background-position: center;
      color: var(--caption-ink);
      font: inherit;
      cursor: zoom-in;
    }
    .frame span { position: absolute; left: .7rem; right: .7rem; bottom: .7rem; text-align: left; font-size: .85rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: 0; }
    .frame:hover span, .frame:focus-visible span { opacity: 1; }
    /* Placeholder gradients. A background-image on the element covers these. */
    .f1 { background-image: linear-gradient(160deg, #d7dde4, #8ea0b0 45%, #c9b7a2); }
    .f2 { background-image: linear-gradient(180deg, #f2e2c4, #c98455 70%, #6e3b2e); }
    .f3 { background-image: linear-gradient(200deg, #1c2430, #3e5c4e 60%, #d8d2c4); }
    .f4 { background-image: linear-gradient(145deg, #f7f4ee, #d9d3c7 40%, #a9a297); }
    .f5 { background-image: linear-gradient(165deg, #2a211c, #8c4a32 55%, #e7c7a1); }
    .f6 { background-image: linear-gradient(180deg, #9bb7c9, #e7eef2 50%, #6d7c86); }
    .f7 { background-image: linear-gradient(150deg, #141414, #3a3a3a 40%, #cfc6b8); }
    .f8 { background-image: linear-gradient(190deg, #e6d3c4, #a36b73 55%, #2c2428); }
    .f9 { background-image: linear-gradient(170deg, #bfc6a8, #6f7d55 50%, #1e2418); }
    footer { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 0 1.2rem 4rem; color: var(--muted); font-size: .92rem; }

    /* ---------- LIGHTBOX ---------- */
    .lightbox { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100%; height: 100%; color: var(--ink); }
    .lightbox::backdrop { background: var(--dialog-bg); }
    .lightbox-inner { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9rem; width: 100%; height: 100%; padding: 3.5rem 1rem 1.5rem; }
    .large { width: min(92vw, 1100px); flex: 1 1 auto; min-height: 0; max-height: 80vh; aspect-ratio: 4 / 5; background-size: contain; background-position: center; background-repeat: no-repeat; }
    .lightbox p { margin: 0; font-size: .95rem; color: var(--muted); }
    .close { position: absolute; top: 1rem; right: 1rem; min-width: 44px; min-height: 44px; padding: 0 .9rem; border: 1px solid var(--muted); border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-size: .85rem; cursor: pointer; }

    .template-gallery {
      position: fixed; z-index: 5; top: 0; left: 0; right: 0;
      height: var(--gallery-bar);
      display: flex; align-items: center; justify-content: center;
      background: var(--ink); color: var(--wall);
      text-decoration: none; font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    }
    @media (max-width: 800px) {
      .sheet { grid-template-columns: 1fr 1fr; gap: .35rem; padding: 0 .45rem 2.5rem; }
      header { flex-direction: column; align-items: flex-start; }
      nav a { display: inline-flex; align-items: center; min-height: 44px; }
      .frame span { opacity: 1; color: #fff; font-size: .72rem; text-shadow: 0 1px 8px rgba(0,0,0,.55); }
    }
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div>
      <h1 data-field="name">Jules Marin</h1>
      <p class="meta" data-field="role">Photographer · Lisbon</p>
    </div>
    <nav aria-label="Contact">
      <a data-field="email" href="mailto:studio@julesmarin.example">Email</a>
      <a data-field="instagram" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </header>
  <!-- ===== CONTACT SHEET: copy one <button class="frame"> per photo. Add style="background-image: url('photos/…')" ===== -->
  <main class="sheet" id="work" aria-label="Selected photographs">
    <button class="frame f1" type="button"><span data-field="caption">Coast road, January</span></button>
    <button class="frame f2" type="button"><span data-field="caption">Kitchen, late</span></button>
    <button class="frame f3" type="button"><span data-field="caption">River stairs</span></button>
    <button class="frame f4" type="button"><span data-field="caption">Studio wall</span></button>
    <button class="frame f5" type="button"><span data-field="caption">Market, closing</span></button>
    <button class="frame f6" type="button"><span data-field="caption">Ferry window</span></button>
    <button class="frame f7" type="button"><span data-field="caption">Rehearsal</span></button>
    <button class="frame f8" type="button"><span data-field="caption">Guest room</span></button>
    <button class="frame f9" type="button"><span data-field="caption">Orchard road</span></button>
  </main>
  <!-- ===== FOOTER ===== -->
  <footer id="contact">
    <span data-field="about">Commissioned work and a slower personal series about rooms people are about to leave.</span>
    <span data-field="year">2026</span>
  </footer>

  <!-- ===== LIGHTBOX: filled by the script from the clicked frame ===== -->
  <dialog class="lightbox" id="lightbox" aria-label="Photograph">
    <div class="lightbox-inner">
      <button class="close" type="button" id="lightbox-close">Close</button>
      <div class="large" id="lightbox-image" role="img"></div>
      <p id="lightbox-caption"></p>
    </div>
  </dialog>

  <a class="template-gallery" href="../../index.html">All templates</a>
  <script>
    // Opens a frame in the lightbox. Uses data-full if present, otherwise the frame's own background.
    (function () {
      const dialog = document.getElementById("lightbox");
      if (!dialog || typeof dialog.showModal !== "function") return;
      const image = document.getElementById("lightbox-image");
      const caption = document.getElementById("lightbox-caption");
      document.querySelectorAll(".frame").forEach((frame) => {
        frame.addEventListener("click", () => {
          const full = frame.dataset.full;
          image.style.backgroundImage = full ? "url('" + full + "')" : getComputedStyle(frame).backgroundImage;
          const text = frame.querySelector("span");
          caption.textContent = text ? text.textContent : "";
          image.setAttribute("aria-label", caption.textContent);
          dialog.showModal();
        });
      });
      document.getElementById("lightbox-close").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
    })();
  </script>
</body>
</html>
